 await check('Theme contrast, bundled fonts, reduced motion and 200% reading zoom',async()=>{
  const luminance=color=>{let hex=color.trim().replace('#','');if(hex.length===3)hex=[...hex].map(c=>c+c).join('');const values=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*values[0]+.7152*values[1]+.0722*values[2];};

  fill('pref-theme','system');fill('pref-accent','blue');el('appearance-form').requestSubmit();await wait(()=>!el('appearance-dialog').open,'Contrast preference save failed');nav('home');d.documentElement.style.zoom='2';await new Promise(r=>setTimeout(r,50));assert(d.documentElement.scrollWidth<=w.innerWidth+1,'200% zoom overflow');d.documentElement.style.zoom='';
