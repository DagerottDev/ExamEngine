name: ExamEngine CI

on:
  push:
    branches: [main, "goal/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Core unit tests
        run: npm test
      - name: Python validator parity tests
        run: python3 -m unittest tests/validator_test.py
      - name: Validate sample pack
        run: npm run validate:sample
      - name: Build offline single-file distribution
        run: npm run build
      - name: Verify deterministic distribution
        run: npm run build:check
      - name: Install headless browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Browser storage, workflow and offline acceptance
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: output/browser
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp LICENSE mcq-exam-website/LICENSE
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: mcq-exam-website
      - name: Publish generated distribution back to branch
        if: github.event_name == 'push'
        run: |
          git add mcq-exam-website/index.html
          if git diff --cached --quiet; then
            echo "Distribution already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build offline ExamEngine v2 distribution [skip ci]"
          git push

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
